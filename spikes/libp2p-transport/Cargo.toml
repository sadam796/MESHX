[package]
name = "meshx-libp2p-transport-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
libp2p = { version = "=0.57.1", default-features = false, features = [
    "autonat",
    "dcutr",
    "dns",
    "ed25519",
    "identify",
    "kad",
    "macros",
    "noise",
    "ping",
    "quic",
    "relay",
    "rendezvous",
    "request-response",
    "cbor",
    "tcp",
    "tokio",
    "yamux",
] }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
futures = "=0.3.31"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
