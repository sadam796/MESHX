[package]
name = "meshx-android-ffi-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
libp2p = { version = "=0.57.1", default-features = false, features = ["ed25519", "noise", "relay", "tcp", "tokio", "yamux"] }
meshx-libp2p-transport-spike = { path = "../libp2p-transport" }
futures = "=0.3.31"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
openmls = { version = "=0.9.2", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
