[package]
name = "meshx-android-ffi-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
libp2p = { version = "=0.57.1", default-features = false, features = ["ed25519", "noise", "tcp", "tokio", "yamux"] }
meshx-libp2p-transport-spike = { path = "../libp2p-transport" }
futures = "=0.3.31"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "net"] }

[dev-dependencies]
