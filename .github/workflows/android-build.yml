name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;28.0.13004108
          accept-android-sdk-licenses: true

      - name: Configure Android linker
        run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_x86_64_linux_android=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_x86_64_linux_android=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build Rust JNI library for Android ARM64
        working-directory: spikes/meshx-android-ffi
        run: cargo build --release --target aarch64-linux-android

      - name: Build Rust JNI library for Android x86_64 emulator
        working-directory: spikes/meshx-android-ffi
        run: cargo build --release --target x86_64-linux-android

      - name: Package Rust JNI libraries into Android app
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          cp spikes/meshx-android-ffi/target/aarch64-linux-android/release/libmeshx_android_ffi_spike.so android/app/src/main/jniLibs/arm64-v8a/libmeshx_android_ffi.so
          cp spikes/meshx-android-ffi/target/x86_64-linux-android/release/libmeshx_android_ffi_spike.so android/app/src/main/jniLibs/x86_64/libmeshx_android_ffi.so

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify JNI library is packaged in APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmeshx_android_ffi.so'

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm "$USER"
          ls -l /dev/kvm

      - name: Launch app and verify JNI call on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -e
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop org.meshx.app
            adb shell monkey -p org.meshx.app 1
            sleep 8
            adb shell pidof org.meshx.app
            adb logcat -d -s AndroidRuntime:E | tee /tmp/meshx-android-runtime-errors.log
            ! grep -q "FATAL EXCEPTION" /tmp/meshx-android-runtime-errors.log
            adb logcat -d -s MESHX_NATIVE:I | tee /tmp/meshx-native-status.log
            grep -q "MESHX libp2p TCP listener active" /tmp/meshx-native-status.log
            FIRST_PEER_ID=$(grep "MESHX libp2p TCP listener active" /tmp/meshx-native-status.log | tail -n 1 | sed -n 's/.*peer id \([^;]*\);.*/\1/p')
            test -n "$FIRST_PEER_ID"
            adb shell am force-stop org.meshx.app
            adb logcat -c
            adb shell monkey -p org.meshx.app 1
            sleep 8
            adb shell pidof org.meshx.app
            adb logcat -d -s MESHX_NATIVE:I | tee /tmp/meshx-native-status-after-restart.log
            grep -q "MESHX libp2p TCP listener active" /tmp/meshx-native-status-after-restart.log
            SECOND_PEER_ID=$(grep "MESHX libp2p TCP listener active" /tmp/meshx-native-status-after-restart.log | tail -n 1 | sed -n 's/.*peer id \([^;]*\);.*/\1/p')
            test -n "$SECOND_PEER_ID"
            test "$FIRST_PEER_ID" = "$SECOND_PEER_ID"
            echo "MESHX persistent Peer ID verified after app restart: $SECOND_PEER_ID"
            adb shell screencap -p /sdcard/meshx-home.png
            adb pull /sdcard/meshx-home.png /tmp/meshx-home.png

      - name: Verify exported JNI entry point
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_BIN/llvm-nm" -D android/app/src/main/jniLibs/arm64-v8a/libmeshx_android_ffi.so | grep -E 'Java_org_meshx_app_NativeMeshx_native(TransportStatus|StartTransport)'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meshx-debug-apk-and-ui
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            /tmp/meshx-home.png
          if-no-files-found: error
          retention-days: 7
