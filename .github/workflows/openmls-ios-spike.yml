name: OpenMLS iOS compatibility

on:
  push:
    branches: [main]
    paths:
      - "spikes/openmls-android/**"
      - ".github/workflows/openmls-ios-spike.yml"
      - "docs/OPENMLS_SPIKE_PLAN.md"
      - "docs/ROADMAP.md"
  pull_request:
    branches: [main]
    paths:
      - "spikes/openmls-android/**"
      - ".github/workflows/openmls-ios-spike.yml"
      - "docs/OPENMLS_SPIKE_PLAN.md"
      - "docs/ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: read

# Keep the Apple validation in one job. This avoids parallel macOS runner
# allocation and ensures a single result covers every compatibility check.
concurrency:
  group: openmls-ios-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-compatibility:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain and both Apple targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Confirm Apple SDKs and toolchain
        run: |
          rustc --version
          cargo --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Run shared two-member MLS protocol and persistence tests
        working-directory: spikes/openmls-android
        run: cargo test

      - name: Compile OpenMLS and test code for physical iPhone ARM64
        working-directory: spikes/openmls-android
        run: cargo check --tests --target aarch64-apple-ios

      - name: Compile OpenMLS and test code for Apple Silicon iOS Simulator
        working-directory: spikes/openmls-android
        run: cargo check --tests --target aarch64-apple-ios-sim
