name: OpenMLS Android ARM64 spike

on:
  push:
    branches: [main]
    paths:
      - "spikes/openmls-android/**"
      - ".github/workflows/openmls-android-spike.yml"
  pull_request:
    branches: [main]
    paths:
      - "spikes/openmls-android/**"
      - ".github/workflows/openmls-android-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.91 and Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: aarch64-linux-android

      - name: Install Android SDK and pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;28.0.13004108
          accept-android-sdk-licenses: true

      - name: Configure Android linker
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Confirm toolchain
        run: |
          rustc --version
          cargo --version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" --version

      - name: Compile OpenMLS for Android ARM64
        working-directory: spikes/openmls-android
        run: cargo check --target aarch64-linux-android
